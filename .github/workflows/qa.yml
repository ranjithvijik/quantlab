name: QuantLab QA

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:          # allows manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel stale runs on new push

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Full test suite
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: "Test Suite (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run QA orchestrator
        run: python run_tests.py --out QA-REPORT-py${{ matrix.python-version }}.md

      - name: Upload QA report
        if: always()     # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-py${{ matrix.python-version }}
          path: |
            QA-REPORT-py${{ matrix.python-version }}.md
            tests/coverage_html/
          retention-days: 30

      - name: Upload coverage to summary
        if: always()
        run: |
          echo "## QA Results — Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Print the markdown report directly into the Actions summary
          cat QA-REPORT-py${{ matrix.python-version }}.md >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Commit the QA report back to the repo (main branch only)
  # ──────────────────────────────────────────────────────────────────────────
  commit-report:
    name: "Commit QA Report"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Regenerate QA report
        run: python run_tests.py --out QA-REPORT.md

      - name: Commit QA-REPORT.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update QA-REPORT.md [skip ci]"
          file_pattern: "QA-REPORT.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
