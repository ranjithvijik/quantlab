[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html:tests/coverage_html
    --cov-config=.coveragerc
markers =
    unit: pure unit tests (no I/O)
    integration: integration tests (may use network)
    slow: slow tests
